<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>À l’affiche de ton humeur</title>
<style>
:root {
color-scheme: dark;
--background: #10111a;
--panel: #191b29;
--muted: #a9acc0;
--text: #f5f5fb;
--accent: #b59cff;
--accent-strong: #8b68ee;
--border: #2b2d40;
}

* { box-sizing: border-box; }

body {
margin: 0;
min-height: 100vh;
background:
radial-gradient(ellipse at top, #27213e 0, transparent 45%),
var(--background);
color: var(--text);
font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
width: min(960px, 100%);
margin: 0 auto;
padding: 48px 20px 72px;
}

header { margin-bottom: 30px; }

.eyebrow {
color: var(--accent);
font-size: .8rem;
font-weight: 700;
letter-spacing: .12em;
text-transform: uppercase;
}

h1 {
margin: 10px 0;
font-size: clamp(2rem, 7vw, 3.5rem);
line-height: 1.05;
}

header p, .hint { color: var(--muted); }

.panel {
padding: 24px;
background: rgba(25, 27, 41, .94);
border: 1px solid var(--border);
border-radius: 20px;
}

.fields {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 18px;
}

label {
display: block;
margin-bottom: 8px;
font-size: .95rem;
font-weight: 650;
}

select {
width: 100%;
padding: 13px 14px;
color: var(--text);
background: #10111a;
border: 1px solid var(--border);
border-radius: 11px;
font: inherit;
}

button {
margin-top: 20px;
padding: 13px 20px;
color: white;
background: var(--accent-strong);
border: 0;
border-radius: 11px;
cursor: pointer;
font: inherit;
font-weight: 700;
}

button:hover { background: #7752d7; }

#results { margin-top: 32px; }

.results-heading {
margin-bottom: 16px;
font-size: 1.35rem;
}

.movie-list {
display: grid;
gap: 14px;
}

.movie {
padding: 20px;
background: var(--panel);
border: 1px solid var(--border);
border-radius: 16px;
}

.movie h3 { margin: 0 0 8px; font-size: 1.2rem; }
.movie-meta { margin-bottom: 12px; color: var(--accent); font-size: .9rem; }
.movie p { margin: 0; color: #d4d5e0; line-height: 1.6; }

.empty {
padding: 20px;
color: var(--muted);
background: var(--panel);
border: 1px solid var(--border);
border-radius: 16px;
}

@media (max-width: 600px) {
main { padding-top: 30px; }
.fields { grid-template-columns: 1fr; }
.panel { padding: 18px; }
button { width: 100%; }
}
</style>
</head>
<body>
<main>
<header>
<div class="eyebrow">Le cinéma selon toi</div>
<h1>Quel film pour ton humeur ?</h1>
<p>Choisis ton état d’esprit et ce dont tu as envie. Je te propose des films avec leur résumé.</p>
</header>

<section class="panel" aria-label="Préférences de films">
<div class="fields">
<div>
<label for="mood">Comment tu te sens ?</label>
<select id="mood">
<option value="happy">De bonne humeur</option>
<option value="sad">Un peu triste</option>
<option value="stressed">Stressé·e</option>
<option value="tired">Fatigué·e</option>
<option value="curious">Curieux·se</option>
</select>
</div>

<div>
<label for="desire">Tu as envie de…</label>
<select id="desire">
<option value="laugh">Rire</option>
<option value="think">Réfléchir</option>
<option value="adventure">Partir à l’aventure</option>
<option value="love">Voir une histoire d’amour</option>
<option value="thrill">Avoir des frissons</option>
<option value="dream">M’évader</option>
</select>
</div>
</div>

<button id="recommendButton" type="button">Trouver mon film</button>
</section>

<section id="results" aria-live="polite"></section>
</main>

<script>
const films = [
{
title: "Intouchables",
year: 2011,
genres: ["comédie", "émotion"],
tags: ["laugh", "sad", "happy"],
summary: "Après un accident, Philippe, un aristocrate devenu tétraplégique, engage Driss, un jeune homme qui vient de sortir de prison. Leur rencontre inattendue donne naissance à une amitié drôle et profondément humaine."
},
{
title: "Le Fabuleux Destin d’Amélie Poulain",
year: 2001,
genres: ["comédie", "romance"],
tags: ["happy", "tired", "love", "dream"],
summary: "Amélie, une jeune serveuse parisienne à l’imagination débordante, décide d’améliorer discrètement la vie des gens qui l’entourent. En aidant les autres, elle apprend aussi à s’ouvrir à l’amour."
},
{
title: "Interstellar",
year: 2014,
genres: ["science-fiction", "aventure"],
tags: ["curious", "think", "adventure", "dream"],
summary: "Alors que la Terre devient de moins en moins habitable, un groupe d’explorateurs part à la recherche d’un nouveau foyer pour l’humanité. Le voyage met à l’épreuve le temps, les liens familiaux et les limites de l’espace."
},
{
title: "Le Voyage de Chihiro",
year: 2001,
genres: ["animation", "aventure", "fantastique"],
tags: ["tired", "dream", "adventure", "curious"],
summary: "Chihiro se retrouve dans un monde étrange peuplé d’esprits après que ses parents ont été transformés. Pour les sauver et retrouver le chemin de la maison, elle doit apprendre à se débrouiller seule."
},
{
title: "La La Land",
year: 2016,
genres: ["romance", "musical", "drame"],
tags: ["happy", "sad", "love", "dream"],
summary: "À Los Angeles, une actrice en devenir et un pianiste passionné se rencontrent et tombent amoureux. Tandis qu’ils poursuivent leurs rêves, leur relation doit trouver sa place dans leurs ambitions."
},
{
title: "À couteaux tirés",
year: 2019,
genres: ["mystère", "comédie"],
tags: ["curious", "think", "laugh", "thrill"],
summary: "Après la mort d’un célèbre auteur de romans policiers, un détective est chargé d’interroger une famille pleine de secrets. Chacun semble avoir quelque chose à cacher et l’enquête réserve plusieurs surprises."
},
{
title: "Les Évadés",
year: 1994,
genres: ["drame"],
tags: ["sad", "think", "dream"],
summary: "Andy Dufresne, condamné à la prison à perpétuité, se lie d’amitié avec Red derrière les murs d’une prison. Au fil des années, l’espoir devient une force essentielle pour survivre."
},
{
title: "Mad Max: Fury Road",
year: 2015,
genres: ["action", "aventure"],
tags: ["stressed", "adventure", "thrill"],
summary: "Dans un désert postapocalyptique, Max rejoint Furiosa dans une fuite à grande vitesse contre un chef de guerre tyrannique. Leur traversée devient une lutte pour la liberté et la survie."
},
{
title: "Paddington 2",
year: 2017,
genres: ["comédie", "aventure", "famille"],
tags: ["sad", "tired", "laugh", "dream"],
summary: "Installé à Londres, l’ours Paddington cherche un cadeau parfait pour sa tante. Lorsqu’un livre rare est dérobé, il se retrouve embarqué dans une enquête pleine de gaffes et de bonne volonté."
},
{
title: "Get Out",
year: 2017,
genres: ["thriller", "horreur"],
tags: ["curious", "thrill", "think"],
summary: "Chris rend visite à la famille de sa petite amie et découvre peu à peu que leur accueil chaleureux dissimule quelque chose d’inquiétant. La visite prend rapidement une tournure dangereuse."
},
{
title: "The Grand Budapest Hotel",
year: 2014,
genres: ["comédie", "aventure"],
tags: ["happy", "laugh", "adventure", "dream"],
summary: "Dans un hôtel raffiné d’un pays imaginaire, le concierge Gustave et son jeune protégé Zero se retrouvent mêlés à une affaire de tableau volé et d’héritage disputé."
},
{
title: "Her",
year: 2013,
genres: ["science-fiction", "romance", "drame"],
tags: ["sad", "think", "love"],
summary: "Theodore, encore marqué par une rupture, noue une relation inattendue avec un système d’intelligence artificielle doté d’une voix et d’une personnalité singulières. Leur lien l’amène à repenser l’intimité."
}
];

const moodSelect = document.querySelector("#mood");
const desireSelect = document.querySelector("#desire");
const results = document.querySelector("#results");

function getRecommendations(mood, desire) {
return films
.map((film) => ({
...film,
score:
(film.tags.includes(desire) ? 2 : 0) +
(film.tags.includes(mood) ? 1 : 0)
}))
.filter((film) => film.score > 0)
.sort((a, b) => b.score - a.score || a.title.localeCompare(b.title))
.slice(0, 4);
}

function showRecommendations() {
const recommendations = getRecommendations(
moodSelect.value,
desireSelect.value
);

if (recommendations.length === 0) {
results.innerHTML = `
<div class="empty">Je n’ai pas trouvé de film correspondant. Essaie une autre combinaison.</div>
`;
return;
}

results.innerHTML = `
<h2 class="results-heading">Tes recommandations</h2>
<div class="movie-list">
${recommendations.map((film) => `
<article class="movie">
<h3>${film.title}</h3>
<div class="movie-meta">${film.year} · ${film.genres.join(" · ")}</div>
<p>${film.summary}</p>
</article>
`).join("")}
</div>
`;
}

document
.querySelector("#recommendButton")
.addEventListener("click", showRecommendations);

showRecommendations();
</script>
</body>
</html>
